workflow:
  rules: 
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    
stages:
  - update-apps

update-job:
  stage: update-apps
  image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:a69bc68d691e9e9afd294dbb9ea7a71e38207c2f0a7b689b5dc6a4cacf06f5e6
  before_script:
    - pip install --break-system-packages semver~=3.0.0
  script:
    - git config user.name "App auto updater"
    - git config user.email "hahelp@uni-bremen.de"
    - git remote set-url --push origin $CI_REPOSITORY_URL
    - python .gitlab/ha-app-repo-updater.py
    - git push origin HEAD:$CI_COMMIT_REF_NAME
