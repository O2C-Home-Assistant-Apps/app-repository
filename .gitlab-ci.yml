workflow:
  rules: 
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    
stages:
  - update-apps

update-job:
  stage: update-apps
  image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:0f9811b3b5145364a678ff4d6e8f04ed18e7ffd1784e936f72e7f5d416bb6677
  before_script:
    - pip install --break-system-packages semver~=3.0.0
  script:
    - git config user.name "App auto updater"
    - git config user.email "hahelp@uni-bremen.de"
    - git remote set-url --push origin $CI_REPOSITORY_URL
    - python .gitlab/ha-app-repo-updater.py
    - git push origin HEAD:$CI_COMMIT_REF_NAME
