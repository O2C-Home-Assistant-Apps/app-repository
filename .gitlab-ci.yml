workflow:
  rules: 
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    
stages:
  - update-apps

update-job:
  stage: update-apps
  image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf
  before_script:
    - pip install --break-system-packages semver~=3.0.0
  script:
    - git config user.name "App auto updater"
    - git config user.email "hahelp@uni-bremen.de"
    - git remote set-url --push origin $CI_REPOSITORY_URL
    - python .gitlab/ha-app-repo-updater.py
    - git push origin HEAD:$CI_COMMIT_REF_NAME
